name: Validate repository metadata

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate catalogue, recipes, schemas, and example manifests
        run: python scripts/validate_catalog.py
      - name: Run public-dependency tests
        run: >-
          pytest
          tests/test_features.py
          tests/test_metadata.py
          tests/test_readers.py
      - name: Run static checks
        run: |
          ruff check .
          ruff format --check .
          mypy src
      - name: Check whitespace errors
        run: "git show --check --oneline --pretty=format: HEAD"
