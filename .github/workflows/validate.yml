name: Validate repository metadata

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --extra dev --locked
      - name: Validate catalogue, recipes, schemas, and example manifests
        run: uv run python scripts/validate_catalog.py
      - name: Run offline tests, including the CND round trip
        run: uv run pytest -m "not integration"
      - name: Run static checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Build and install the wheel
        run: |
          uv build
          uv venv /tmp/open-neurodata-wheel
          for build_wheel in dist/*.whl; do
            uv pip install --python /tmp/open-neurodata-wheel/bin/python "${build_wheel}[dev]"
          done
          /tmp/open-neurodata-wheel/bin/python -c "import neurodata_cnd"
          /tmp/open-neurodata-wheel/bin/neurodata-to-cnd --help
          /tmp/open-neurodata-wheel/bin/python -m pytest -m "not integration"
      - name: Check whitespace errors
        run: "git show --check --oneline --pretty=format: HEAD"
