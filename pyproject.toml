[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-neurodata-to-cnd"
version = "0.1.0.dev0"
description = "Convert public EEG datasets into CND"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Finn Clancy" }]
dependencies = [
  "mne>=1.8",
  "mne-bids>=0.17,<0.20",
  "numpy>=1.26",
]

[project.optional-dependencies]
conversion = [
  "cnd-mne-converter @ git+https://github.com/finnjclancy/cnd-mne-converter.git@2d7e4de2951e5fcc1e1b136af3fe8535a907d7e7",
]
dev = [
  "cnd-mne-converter @ git+https://github.com/finnjclancy/cnd-mne-converter.git@2d7e4de2951e5fcc1e1b136af3fe8535a907d7e7",
  "edfio>=0.4",
  "jsonschema>=4.23",
  "mypy>=1.18,<2",
  "pybv>=0.7",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]
test = [
  "edfio>=0.4",
  "jsonschema>=4.23",
  "mypy>=1.18,<2",
  "pybv>=0.7",
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
neurodata-to-cnd = "neurodata_cnd.cli:main"

[project.urls]
Repository = "https://github.com/finnjclancy/open-neurodata-to-cnd"
Issues = "https://github.com/finnjclancy/open-neurodata-to-cnd/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/neurodata_cnd"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: downloads and converts a pinned public source file",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
